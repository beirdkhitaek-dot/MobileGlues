name: Build MobileGlues for Android
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch submodules needed for the build
        run: git submodule update --init --depth 1 MobileGlues-cpp/3rdparty/glslang MobileGlues-cpp/3rdparty/SPIRV-Cross MobileGlues-cpp/3rdparty/xxhash MobileGlues-cpp/include/ska
      - name: Build arm64-v8a
        run: |
          cmake -S MobileGlues-cpp -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target mobileglues -j"$(nproc)"
      - name: Name the library with its version
        run: |
          v() { awk -v k="$1" '$1=="#define" && $2==k {print $3}' MobileGlues-cpp/version.h; }
          VERSION="$(v MAJOR).$(v MINOR).$(v REVISION).$(v PATCH)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir dist
          cp "$(find build -name libmobileglues.so | head -1)" "dist/libmobileglues-$VERSION-arm64-v8a.so"
          "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded dist/*.so
      - uses: actions/upload-artifact@v4
        with:
          name: MobileGlues-Android-arm64
          path: dist/*.so
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## What's new
          - Shaders using \`noperspective\` no longer require GL_NV_shader_noperspective_interpolation. On GPUs without it (such as Mali) the qualifier is removed and smooth interpolation is used.

          ## How to use
          - This is the raw arm64-v8a library, not an installable app. It only works with a launcher that lets you replace its MobileGlues library (file name \`libmobileglues.so\`).
          - Not yet tested on a device.
          NOTES
          gh release create "v$VERSION" dist/*.so --target "$GITHUB_SHA" \
            --title "MobileGlues $VERSION - Mali noperspective fix" --notes-file notes.md
